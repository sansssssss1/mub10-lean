name = "TenDimensionalMUB"
version = "0.1.0"
defaultTargets = ["VerifiedMUB"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.19.0"

[[lean_lib]]
name = "VerifiedMUB"
roots = ["Certificate", "Monomials", "ComplexBridge", "PolyCheck", "Gram", "StrongTriple",
  "Gap", "UniformGap", "Invariant", "Catalogue", "ClassObstruction", "Robust", "RoundedGram",
  "ClassRadius", "Gauge", "DoubleLex", "LeafCertificates", "LexNormal", "LeafCoverage",
  "Distinct", "Complete", "MainResult", "Rectangle", "Deformation", "Neighbourhood", "CurveNeighbourhood",
  "Earlier.Parity", "Earlier.RayExample", "CheckAxioms"]
